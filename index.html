    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: {
              50: '#FDFBF7',
              100: '#F9F6F0',
              200: '#F5EFE6', // Soft Cream
              300: '#EBE0D0',
            },
            beige: {
              100: '#F2ECE4',
              200: '#E5DCD0', // Muted Beige
              300: '#D8C8B8',
            },
            brown: {
              800: '#4A4036', // Warm Brown Text
              900: '#383028', // Darker Brown
            },
            gold: {
              400: '#D4C4A3', // Muted Gold Accent
              500: '#C4B493',
            },
            charcoal: '#1A1A1A',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Montserrat"', 'sans-serif'], // Or Inter, prioritizing Montserrat for soft feel
          },
          animation: {
            'fade-in-up': 'fadeInUp 1s ease-out forwards',
            'fade-in': 'fadeIn 1.2s ease-out forwards',
            'scroll': 'scroll 40s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(30px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scroll: {
              '0%': { transform: 'translateX(0)' },
              '100%': { transform: 'translateX(-50%)' },
            }
          }
        }
      }
    }
  </script>
